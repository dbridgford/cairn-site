<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src blob: data:; connect-src https://api.apple-cloudkit.com https://*.icloud-content.com; frame-src 'self' about:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<title>Shared with Cairn</title>
<style>:root{--fg:#1d1d1f;--muted:#6e6e73;--bg:#fff;--card:#f5f5f7;--accent:#216b78}
@media (prefers-color-scheme:dark){:root{--fg:#f5f5f7;--muted:#a1a1a6;--bg:#111;--card:#1c1c1e;--accent:#5cb8c2}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 -apple-system,system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:32px 16px 64px}a{color:var(--accent)}h1{margin:.2em 0}.muted{color:var(--muted)}
details{background:var(--card);border-radius:14px;padding:12px 18px;margin:14px 0}summary{font-weight:600;cursor:pointer}
iframe{width:100%;height:70vh;border:0;background:#fff;border-radius:8px;margin-top:10px}
.files{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.files img{max-width:100%;max-height:420px;border-radius:8px;display:block}</style>
</head><body><main><p class="muted">Shared securely with Cairn</p><h1 id="title">Opening…</h1><p id="status" class="muted"></p><div id="notes"></div>
<p class="muted">Decrypted in your browser. The key is in the link after “#”, which is never sent to a server.</p></main>
<script src="app.js"></script></body></html>
